<!DOCTYPE html>
<!-- LATTICE -->
<meta charset="utf-8">
<title>latticewall.xyz</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<style>
  :root{
    --blue:#1418C8;
    --blue-dk:#0C0EA0;
    --chrome:#C6C6C6;
    --hi:#FFFFFF;
    --lo:#7A7A7A;
    --dk:#000000;
    --bone:#EDEAD8;
    --amber:#E8C46B; /* plate text color once boxes go black — distinct from the white ivy */
  }
  *{box-sizing:border-box}
  /* lock the page down like an app: no pinch-zoom (also set in the viewport
     meta tag above), no horizontal pan, no accidental sideways drift from a
     vertical swipe. touch-action:pan-y still allows normal up/down scrolling
     and the vine-swipe gesture — it only blocks pinch and horizontal panning.
     NOTE: this used to also set overscroll-behavior-y:contain to kill the
     vertical rubber-band bounce, but that's a known cause of iOS Safari
     intermittently locking scroll entirely near the top/bottom of the page
     (the dynamic toolbar interacts badly with it) — dropped for that reason,
     so a slight bounce at the very top/bottom is the tradeoff for scroll
     actually working every time. */
  html,body{margin:0;padding:0;width:100%;overflow-x:hidden;
            touch-action:pan-y;overscroll-behavior-x:none}
  body{
    position:relative;
    background:var(--blue);
    color:#000;
    font:14px/1.5 Helvetica,Arial,"Helvetica Neue",sans-serif;
    -webkit-font-smoothing:none;
  }
  /* halftone ground + faint plate grid, as on the card */
  #ground{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px),
      radial-gradient(rgba(255,255,255,.16) 34%, transparent 36%);
    background-size:74px 74px, 74px 74px, 6px 6px;
  }

  .col{position:relative;z-index:2;max-width:660px;margin:0 auto;padding:52px 16px 90px}

  /* ---- masthead ---- */
  .mast h1{
    margin:0;color:#fff;
    font:bold 68px/.9 Helvetica,Arial,sans-serif;
    letter-spacing:-.02em;
  }
  /* the halftone wordmark: white letters, see-through dots and background,
     so the page's blue shows through the same way it does on the card */
  .mast h1 .logo{display:block;width:340px;max-width:100%;height:auto}
  .ask{
    display:inline-block;margin:22px 0 0;
    background:var(--chrome);
    border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow:3px 3px 0 rgba(0,0,0,.35);
    padding:14px 18px;
    font:bold 21px/1.28 Helvetica,Arial,sans-serif;
    max-width:26ch;
  }
  /* sits in the gap just above the first overgrown message (placed by renderVines);
     absolutely positioned so it never shifts the layout the vines are measured from */
  .ivy-hint{position:absolute;left:0;bottom:100%;margin:0 0 14px;z-index:6;
            color:#fff;font-size:12px;opacity:.8;letter-spacing:.02em;pointer-events:none}
  .sub{margin:16px 0 0;color:#fff;font-size:13px;opacity:.85;max-width:34ch}

  /* ---- a note ---- */
  .note{position:relative;margin:58px 0 0}
  .frame{
    background:var(--chrome);
    border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow:4px 4px 0 rgba(0,0,0,.35);
    padding:9px;
  }
  .plate{
    background:#000;color:var(--amber);
    border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
    padding:18px 19px 20px;
    font:16px/1.62 Helvetica,Arial,sans-serif;
    text-wrap:pretty;
  }
  .rail{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
        margin-top:9px;flex-wrap:wrap}
  .left{display:flex;align-items:center;gap:5px;min-height:26px}
  .left i{height:30px;display:block;background:#000;padding:3px 4px;
          border:1px solid var(--lo)}
  .left i img{height:24px;width:auto;display:block;image-rendering:pixelated}
  .give{display:flex;gap:3px;opacity:0;transition:opacity .4s}
  .note.awake .give{opacity:1}
  .give{align-items:center;gap:5px}
  .give .lab{font:bold 11px Helvetica,Arial,sans-serif;color:#000;
             letter-spacing:.06em;text-transform:uppercase;opacity:.9;
             margin-right:2px;white-space:nowrap}
  .give button img{height:22px;width:auto;display:block;image-rendering:pixelated;
                   background:#000;padding:3px 4px}
  .give button{
    display:flex;align-items:center;gap:6px;
    padding:5px 9px 5px 5px;cursor:pointer;line-height:1;
    font:bold 11px Helvetica,Arial,sans-serif;color:#111;
    background:var(--chrome);
    border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow:2px 2px 0 rgba(0,0,0,.3);
  }
  .give button:hover{background:#D6D6D6}
  .give button:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);
                      box-shadow:none;transform:translate(2px,2px)}
  .give button:focus-visible{outline:1px dotted #000;outline-offset:-5px}
  .tag{font:bold 12px Helvetica,Arial,sans-serif;color:#333}

  /* growth layer, layered over the whole message column. #vinefield holds
     ONLY decorative decals — never real note content — so it's safe to mask
     as a whole: brushing hides growth, never a message's actual text.
     CONTRACT for vine-interaction.js: any future redesign of the growth
     art only needs to render its decals as children of #vinefield. The
     mask (--mx/--my/--mr) and the scroll-sway transform both live on this
     one element, so nothing else needs to change to swap the art out. */
  #messages{position:relative}
  #vinefield{
    position:absolute;top:0;left:0;right:0;z-index:5;pointer-events:none;
    overflow:visible;
    --mx:-999px; --my:-999px; --mr:0px;
    -webkit-mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my),
      rgba(255,255,255,0) 0%, rgba(255,255,255,0) 58%, rgba(255,255,255,1) 100%);
    mask-image: radial-gradient(circle var(--mr) at var(--mx) var(--my),
      rgba(255,255,255,0) 0%, rgba(255,255,255,0) 58%, rgba(255,255,255,1) 100%);
  }
  .vine-decal{position:absolute;display:block;
              filter:drop-shadow(1px 1px 0 rgba(0,0,0,.5));}

  /* ---- feather ---- */
  #plume{position:fixed;inset:0;z-index:30;pointer-events:none}
  #feather{position:fixed;top:0;left:0;z-index:31;width:64px;height:64px;
           background:none;border:none;padding:0;cursor:pointer;display:none;
           pointer-events:none}
  #feather.live{display:block;pointer-events:auto}   /* tappable mid-fall */
  #feather svg{width:100%;height:100%}

  /* the write button. One fixed home (bottom-right, just above the pocket
     bar) so people learn where it is. It shows up as soon as the pocket
     intro fades — with an empty slot where its feather icon goes — and the
     feather drifts down into that slot. Keyboard users can tab to it even
     earlier; it appears on focus. */
  #quill{
    position:fixed;z-index:32;display:flex;align-items:center;gap:10px;
    right:16px;bottom:70px;
    background:var(--chrome);cursor:pointer;
    border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
    box-shadow:4px 4px 0 rgba(0,0,0,.4);
    padding:9px 14px 9px 10px;
    font:bold 14px Helvetica,Arial,sans-serif;color:#111;
    opacity:0;transform:translateY(6px);pointer-events:none;
    transition:opacity .5s ease, transform .5s ease;
  }
  #quill.in, #quill:focus-visible{opacity:1;transform:translateY(0);pointer-events:auto}
  #quill.done{display:none}
  #quill:hover{background:#D6D6D6}
  #quill:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk);
                box-shadow:none;transform:translate(3px,3px)}
  #quill svg{width:30px;height:30px;flex:none;transition:opacity .3s}
  #quill.awaiting svg{opacity:0}            /* the slot the feather will land in */
  #quill.caught{animation:catch .6s ease}
  @keyframes catch{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
  #quill em{font-style:normal;display:block;font-weight:normal;font-size:11px;opacity:.7}
  @media (max-width:560px){ #quill{font-size:13px;padding:8px 11px 8px 8px;right:10px;bottom:62px} }

  /* ---- compose ---- */
  .veil{position:fixed;inset:0;background:rgba(8,10,120,.86);display:none;
        place-items:center;padding:16px;z-index:60}
  .veil.on{display:grid}
  .box{width:100%;max-width:460px;background:var(--chrome);
       border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
       box-shadow:5px 5px 0 rgba(0,0,0,.4)}
  .box .head{background:var(--blue-dk);color:#fff;font:bold 13px Helvetica,Arial,sans-serif;
             padding:5px 8px;display:flex;justify-content:space-between}
  .box .head b{cursor:pointer;background:var(--chrome);color:#000;
               border:1px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);
               width:18px;text-align:center}
  .box .in{padding:14px}
  .box .q{font:bold 15px/1.3 Helvetica,Arial,sans-serif;margin:0 0 10px}
  textarea{width:100%;min-height:120px;resize:none;background:var(--bone);color:#111;
           font:15px/1.55 Helvetica,Arial,sans-serif;padding:11px;
           border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo)}
  textarea:focus{outline:1px dotted #000;outline-offset:-5px}
  textarea::placeholder{color:#8A8A8A}
  .foot{margin-top:11px;display:flex;justify-content:space-between;align-items:center}
  .rem{font:12px "Courier New",monospace}
  .rem.over{color:#B00000;font-weight:bold}
  .btn{min-width:86px;padding:5px 12px;cursor:pointer;
       font:bold 13px Helvetica,Arial,sans-serif;background:var(--chrome);
       border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi)}
  .btn:active{border-color:var(--dk) var(--hi) var(--hi) var(--dk)}
  .btn[disabled]{color:var(--lo);text-shadow:1px 1px 0 var(--hi);cursor:default}

  /* ---- arrival ---- */
  #arrive{position:fixed;inset:0;z-index:80;background:var(--blue);
          display:grid;place-items:center;transition:opacity .9s ease}
  #arrive .hand{display:flex;gap:26px;align-items:center}
  #arrive .hand i{display:block;opacity:0;transform:translateY(14px) scale(1.25);
                  transition:opacity .5s ease, transform .7s ease}
  #arrive .hand i.in{opacity:1;transform:translateY(0) scale(1)}
  #arrive .hand i{background:#000;padding:14px 16px;
                  border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi)}
  #arrive .hand i img{height:110px;width:auto;display:block;image-rendering:pixelated}
  #arrive.gone{opacity:0;pointer-events:none}

  /* ---- pocket ---- */
  .pocket{position:fixed;left:0;right:0;bottom:0;z-index:26;
          background:var(--chrome);border-top:2px solid var(--hi);
          padding:5px 12px;display:flex;align-items:center;gap:10px}
  .pocket .lab{font:bold 12px Helvetica,Arial,sans-serif}
  .pocket .items-lab{font:bold 11px Helvetica,Arial,sans-serif;color:var(--lo);
             text-transform:uppercase;letter-spacing:.05em;margin-left:auto}
  .pocket .items{display:flex;gap:5px;align-items:center;
                 border:2px solid;border-color:var(--lo) var(--hi) var(--hi) var(--lo);
                 padding:4px 9px;min-height:32px}
  .pocket i{display:block;background:#000;padding:3px 5px;border:1px solid var(--lo)}
  .pocket i img{height:24px;width:auto;display:block;image-rendering:pixelated}
  .pocket .none{font-size:11px;color:var(--lo)}
  .pocket .gardener{font-size:11px;color:var(--lo);text-decoration:none;
                     margin-left:10px;white-space:nowrap}
  .pocket .gardener:hover{color:#333;text-decoration:underline}

  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
  @media (max-width:560px){
    .mast h1{font-size:46px}
    .mast h1 .logo{width:260px}
    .ask{font-size:18px}
    .plate{font-size:15px;padding:16px}
    .col{padding:34px 12px 70px}

    /* arrival: stack vertically on phone widths instead of a horizontal
       row — a flex row with no wrap is what was cutting items off the
       edge of the screen. Also shrunk so up to POCKET_CAP items always
       fit without scrolling on an ordinary phone screen. */
    #arrive .hand{flex-direction:column;gap:14px}

    /* a full pocket (4 items, one of them the wide wing) doesn't fit on one
       line at phone width — let "leave one" wrap instead of pushing buttons
       off-screen, and slim the pocket bar icons so the tray fits too */
    .give{flex-wrap:wrap}
    .pocket{gap:8px;padding:5px 8px}
    .pocket .gardener{margin-left:2px}
    .pocket .items{gap:3px;padding:3px 5px}
    .pocket i{padding:2px 3px}
    .pocket i img{height:18px}
    #arrive .hand i{padding:10px 14px}
    #arrive .hand i img{height:72px}
  }
/* ==== DESKTOP SCALE (generated) ====
   Every px size above, x1.4, for screens 900px and wider —
   the site's default desktop size. Regenerate this block after
   editing sizes above instead of editing it by hand. */
@media (min-width:900px){
  body{font:19.6px/1.5 Helvetica,Arial,"Helvetica Neue",sans-serif}
  #ground{background-image:
      linear-gradient(rgba(255,255,255,.05) 1.4px, transparent 1.4px),
      linear-gradient(90deg, rgba(255,255,255,.05) 1.4px, transparent 1.4px),
      radial-gradient(rgba(255,255,255,.16) 34%, transparent 36%);background-size:103.6px 103.6px, 103.6px 103.6px, 8.4px 8.4px}
  .col{max-width:924px;padding:72.8px 22.4px 126px}
  .mast h1{font:bold 95.2px/.9 Helvetica,Arial,sans-serif}
  .mast h1 .logo{width:476px}
  .ask{margin:30.8px 0 0;border-width:2.8px;box-shadow:4.2px 4.2px 0 rgba(0,0,0,.35);padding:19.6px 25.2px;font:bold 29.4px/1.28 Helvetica,Arial,sans-serif}
  .ivy-hint{margin:0 0 19.6px;font-size:16.8px}
  .sub{margin:22.4px 0 0;font-size:18.2px}
  .note{margin:81.2px 0 0}
  .frame{border-width:2.8px;box-shadow:5.6px 5.6px 0 rgba(0,0,0,.35);padding:12.6px}
  .plate{border-width:2.8px;padding:25.2px 26.6px 28px;font:22.4px/1.62 Helvetica,Arial,sans-serif}
  .rail{gap:16.8px;margin-top:12.6px}
  .left{gap:7px;min-height:36.4px}
  .left i{height:42px;padding:4.2px 5.6px;border-width:1.4px}
  .left i img{height:33.6px}
  .give{gap:4.2px}
  .give{gap:7px}
  .give .lab{font:bold 15.4px Helvetica,Arial,sans-serif;margin-right:2.8px}
  .give button img{height:30.8px;padding:4.2px 5.6px}
  .give button{gap:8.4px;padding:7px 12.6px 7px 7px;font:bold 15.4px Helvetica,Arial,sans-serif;border-width:2.8px;box-shadow:2.8px 2.8px 0 rgba(0,0,0,.3)}
  .give button:active{transform:translate(2.8px,2.8px)}
  .give button:focus-visible{outline:1.4px dotted #000;outline-offset:-7px}
  .tag{font:bold 16.8px Helvetica,Arial,sans-serif}
  #vinefield{--mx:-1398.6px;--my:-1398.6px;--mr:0px}
  .vine-decal{filter:drop-shadow(1.4px 1.4px 0 rgba(0,0,0,.5))}
  #feather{width:89.6px;height:89.6px}
  #quill{gap:14px;right:22.4px;bottom:98px;border-width:2.8px;box-shadow:5.6px 5.6px 0 rgba(0,0,0,.4);padding:12.6px 19.6px 12.6px 14px;font:bold 19.6px Helvetica,Arial,sans-serif;transform:translateY(8.4px)}
  #quill:active{transform:translate(4.2px,4.2px)}
  #quill svg{width:42px;height:42px}
  #quill em{font-size:15.4px}
  .veil{padding:22.4px}
  .box{max-width:644px;border-width:2.8px;box-shadow:7px 7px 0 rgba(0,0,0,.4)}
  .box .head{font:bold 18.2px Helvetica,Arial,sans-serif;padding:7px 11.2px}
  .box .head b{border-width:1.4px;width:25.2px}
  .box .in{padding:19.6px}
  .box .q{font:bold 21px/1.3 Helvetica,Arial,sans-serif;margin:0 0 14px}
  textarea{min-height:168px;font:21px/1.55 Helvetica,Arial,sans-serif;padding:15.4px;border-width:2.8px}
  textarea:focus{outline:1.4px dotted #000;outline-offset:-7px}
  .foot{margin-top:15.4px}
  .rem{font:16.8px "Courier New",monospace}
  .btn{min-width:120.4px;padding:7px 16.8px;font:bold 18.2px Helvetica,Arial,sans-serif;border-width:2.8px}
  .btn[disabled]{text-shadow:1.4px 1.4px 0 var(--hi)}
  #arrive .hand{gap:36.4px}
  #arrive .hand i{transform:translateY(19.6px) scale(1.25)}
  #arrive .hand i{padding:19.6px 22.4px;border-width:2.8px}
  #arrive .hand i img{height:154px}
  .pocket{border-top-width:2.8px;padding:7px 16.8px;gap:14px}
  .pocket .lab{font:bold 16.8px Helvetica,Arial,sans-serif}
  .pocket .items-lab{font:bold 15.4px Helvetica,Arial,sans-serif}
  .pocket .items{gap:7px;border-width:2.8px;padding:5.6px 12.6px;min-height:44.8px}
  .pocket i{padding:4.2px 7px;border-width:1.4px}
  .pocket i img{height:33.6px}
  .pocket .none{font-size:15.4px}
  .pocket .gardener{font-size:15.4px;margin-left:14px}
}
/* ==== END DESKTOP SCALE ==== */
</style>

<!-- ============================================================
     LATTICE DB — writing to Firestore (posting a message, leaving an
     item) goes through `window.LatticeDB` here. READING the wall does
     not: boot() further down reads it with one plain request to
     Firestore's REST API, so the wall shows up without waiting for
     this library to download. Module scripts execute deferred, so
     LatticeDB may not exist for the first moment; posting before it
     loads just shows "Try again".
     ============================================================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getFirestore, collection, addDoc, getDocs, query, orderBy, limit,
    doc, runTransaction, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // Analytics is intentionally left out. LATTICE runs anonymously with
  // no accounts by design — adding tracking nobody agreed to would cut
  // against that on purpose, not by oversight.
  const firebaseConfig = {
    apiKey: "AIzaSyDl32I3wTqjdNKRloDCI4iqVAyDIrN80Hw",
    authDomain: "lattice-731c2.firebaseapp.com",
    projectId: "lattice-731c2",
    storageBucket: "lattice-731c2.firebasestorage.app",
    messagingSenderId: "593182874170",
    appId: "1:593182874170:web:6f96289b5e26102b9cb303"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const messagesCol = collection(db, 'messages');

  // fetched once per visit (not a live subscription) — matches the
  // "load fresh each visit" choice: simpler, and matches how people
  // actually arrive here, via a scanned QR code, not a left-open tab
  async function fetchMessages(cap = 300){
    const q = query(messagesCol, orderBy('createdAt', 'desc'), limit(cap));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, t: d.data().text, left: d.data().left || [] }));
  }

  async function postMessage(text){
    const ref = await addDoc(messagesCol, { text, left: [], createdAt: serverTimestamp() });
    notifyGardener(text, ref.id);
    return ref.id;
  }

  // emails Tristan through the same Formspree form as the contact page, with
  // a direct link to the message in the Firebase console so a bad one can be
  // deleted in two clicks. Fire-and-forget: if it fails, the post still stands.
  function notifyGardener(text, id){
    fetch("https://formspree.io/f/xzebnjql", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: "LATTICE — new message on the wall",
        message: text,
        delete_link: "https://console.firebase.google.com/project/lattice-731c2/firestore/databases/-default-/data/~2Fmessages~2F" + id
      })
    }).catch(() => {});
  }

  // NOT arrayUnion: arrayUnion silently drops a value already present
  // in the array, but `left` is supposed to accumulate repeats (a
  // second acorn on the same message has to actually show up twice).
  // A transaction reads the current array and appends for real, and
  // Firestore retries it automatically if two gifts land at once.
  async function giveGift(messageId, item){
    const ref = doc(db, 'messages', messageId);
    await runTransaction(db, async (tx) => {
      const snap = await tx.get(ref);
      if (!snap.exists()) throw new Error('message no longer exists');
      const current = snap.data().left || [];
      tx.update(ref, { left: [...current, item] });
    });
  }

  window.LatticeDB = { fetchMessages, postMessage, giveGift };
  window.dispatchEvent(new Event('lattice:ready'));
</script>

// desktop default size: everything is 1.4x on screens 900px and wider (the CSS
// half of this is the generated DESKTOP SCALE block at the end of <style>).
// Sizes set from code — vines, brush, feather — multiply by this.
const UI_MQ = matchMedia('(min-width: 900px)');

const ico = k => ART[k] ? `<img src="${ART[k]}" alt="${k}">` : '';

// user-written text is untrusted the moment it can come from a stranger
// via Firestore, not just from this one browser — escape before it ever
// reaches innerHTML
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

// shown only if Firestore can't be reached, or the wall is genuinely
// empty (nothing seeded yet) — never written to the database, purely
// a local "don't show a blank page" fallback

let messages = [];

const wrap=document.getElementById('messages');

/* one continuous plant, rooted below the oldest message, climbing the
   whole column. depth 0 = top (newest), depth 1 = bottom (oldest).
   strength is a pure function of pixel position, not of which note
   you're "in" — so nothing resets or restarts between messages. */
function strengthAt(depthFrac){
  let st = Math.max(0, (depthFrac - 0.38) / 0.62);
  return Math.pow(st, 0.72);
}

   never touches that part.

   >>> SWAP POINT: replace CORNER_ART below with real Photoshop
   assets once they exist. Each stage can point at a different
   image (or several, picked at random) instead of reusing the
   card's leaf icon. Sizes/rotations are guidance, not gospel —
   tune them once real art is in.
   ============================================================ */
const CORNER_ART = {
  // stage 0 = nothing. stages 1-3 = light / full / heavy overgrowth.
  // `cornerCount` is how many of the note's 4 corners actually get growth
  // — picked at random per note, not the same corners every time, so a
  // wall of notes doesn't read as "every box, all four corners." Usually
  // 2; only the heaviest stage climbs to 3 — never all 4 at once.
  // `pull` is how far the decal's center is dragged in from the exact
  // corner point, as a fraction of its own size — small for a light
  // accent that just grips the edge, large for heavy growth that's
  // meant to actually encroach onto the message text itself.
  1: { cornerCount: 2, count: [1,1], size: [70, 100],  rot: 8,  pull: 0.28 },
  2: { cornerCount: 2, count: [1,1], size: [130, 170], rot: 8,  pull: 0.44 },
  3: { cornerCount: 3, count: [1,1], size: [190, 240], rot: 8,  pull: 0.58 },
};
const ALL_CORNERS = ['tl','tr','bl','br'];

// picks `n` distinct corners at random, using the note's own seeded rng
// so the choice is stable across re-renders (same note, same corners)
function pickCorners(n, rng){
  const pool = ALL_CORNERS.slice();
  const picked = [];
  for (let i = 0; i < n && pool.length; i++){
    const idx = Math.floor(rng() * pool.length);
    picked.push(pool.splice(idx, 1)[0]);
  }
  return picked;
}
const STAGE_THRESHOLDS = [0.38, 0.55, 0.78]; // strength boundaries -> stage 0/1/2/3

function stageFor(strength){
  if (strength < STAGE_THRESHOLDS[0]) return 0;
  if (strength < STAGE_THRESHOLDS[1]) return 1;
  if (strength < STAGE_THRESHOLDS[2]) return 2;
  return 3;
}

// deterministic per-note "random" so a note's growth doesn't reshuffle
// on every re-render (new messages arriving shouldn't visibly disturb
// growth already attached to older ones)
function noteRng(seedNum){
  let s = Math.abs(seedNum*9301 + 49297) % 233280;
  return () => (s = (s*9301 + 49297) % 233280) / 233280;
}

// the ivy art is drawn as a single bottom-left clump (thick at bl,
// thinning toward the top). The other three corners reuse it mirrored,
// rather than needing four hand-drawn variants.
function flipFor(corner){
  return {
    fx: corner.includes('r') ? -1 : 1,
    fy: corner.includes('t') ? -1 : 1,
  };
}

// builds the decal elements for one note's corner, given its stage.
// cx/cy below are where, in field-local px, that corner sits.
function decalsForCorner(corner, stage, cx, cy, rng){
  const spec = CORNER_ART[stage];
  if (!spec) return [];
  const n = spec.count[0] + Math.round(rng() * (spec.count[1]-spec.count[0]));
  const { fx, fy } = flipFor(corner);
  const out = [];
  for (let i = 0; i < n; i++){
    const size = (spec.size[0] + rng() * (spec.size[1]-spec.size[0])) * uiScale();
    const rot  = (rng()-0.5) * 2 * spec.rot;   // small jitter only — this is
                                                 // directional art, not a free
                                                 // scatter, so it stays close
                                                 // to its mirrored orientation
    const jx = (rng()-0.5) * 2 * 16 * uiScale();            // fixed-px jitter, independent
    const jy = (rng()-0.5) * 2 * 16 * uiScale();            // of size (large art shouldn't
                                                 // wander further than small art)
    // drag the decal's center in from the exact corner point, toward the
    // box's interior — this is what makes it encroach onto the message
    // rather than just sit as a border accent
    const pullX = corner.includes('l') ? size*spec.pull : -size*spec.pull;
    const pullY = corner.includes('t') ? size*spec.pull : -size*spec.pull;
    out.push({ x: cx + jx + pullX, y: cy + jy + pullY, size, rot, fx, fy, corner });
  }
  return out;
}

/* rebuild the field to match the current (possibly just-changed) column
   height and each note's real, measured geometry — called after every
   render() and on resize */
function renderVines(){
  let field = document.getElementById('vinefield');
  if (!field){
    field = document.createElement('div');
    field.id = 'vinefield';
    field.setAttribute('aria-hidden','true');
    wrap.prepend(field);
  }
  const totalHeight = Math.round(wrap.scrollHeight) + 60;
  field.style.height = totalHeight + 'px';
  field.innerHTML = '';

  const fieldRect = field.getBoundingClientRect();
  const notes = [...wrap.querySelectorAll('.note')];
  const frag = document.createDocumentFragment();

  notes.forEach((note, i) => {
    const frame = note.querySelector('.frame');
    if (!frame) return;
    // how overgrown a note is still comes from where the whole box sits on
    // the page — but the vines themselves anchor to the corners of the TEXT
    // box (.plate), not the whole frame. The frame also contains the items
    // row, which wraps to 2-3 lines on a phone; anchoring to the frame put
    // the bottom corners' growth on the items instead of the words.
    const fr = frame.getBoundingClientRect();
    const frameCenterY = (fr.top + fr.bottom) / 2 - fieldRect.top;
    const strength = strengthAt(Math.max(0, Math.min(1, frameCenterY / totalHeight)));
    const r = (note.querySelector('.plate') || frame).getBoundingClientRect();
    const top    = r.top    - fieldRect.top;
    const bottom = r.bottom - fieldRect.top;
    const left   = r.left   - fieldRect.left;
    const right  = r.right  - fieldRect.left;
    const stage = stageFor(strength);
    delete note.dataset.overgrown; delete note.dataset.vineY;
    if (stage === 0) return;
    note.dataset.overgrown = stage;

    const rng = noteRng(4242 + i*97);
    const corners = {
      tl: [left, top], tr: [right, top],
      bl: [left, bottom], br: [right, bottom],
    };
    const chosen = pickCorners(CORNER_ART[stage].cornerCount, rng);
    chosen.forEach(name => {
      const [cx, cy] = corners[name];
      decalsForCorner(name, stage, cx, cy, rng).forEach(d => {
        if (!note.dataset.vineY) note.dataset.vineY = d.y.toFixed(0);   // field-local
        const img = document.createElement('img');
        img.className = 'vine-decal';
        img.src = ART.ivyCorner;
        img.style.left = (d.x - d.size/2) + 'px';
        img.style.top  = (d.y - d.size/2) + 'px';
        img.style.width = d.size + 'px';
        img.style.height = d.size + 'px';
        img.style.transform = `scaleX(${d.fx}) scaleY(${d.fy}) rotate(${d.rot.toFixed(1)}deg)`;
        img.style.opacity = (0.85 + rng()*0.15).toFixed(2);
        frag.appendChild(img);
      });
    });
  });

  field.appendChild(frag);

  // "brush the ivy aside…" goes right where the ivy starts: just above the
  // first overgrown message. Re-placed on every render/resize, since which
  // message is first to be overgrown depends on the wall's current height.
  wrap.querySelectorAll('.ivy-hint').forEach(el => el.remove());
  const firstOvergrown = wrap.querySelector('.note[data-overgrown]');
  if (firstOvergrown){
    const line = document.createElement('p');
    line.className = 'ivy-hint';
    line.textContent = 'brush the ivy aside to read the oldest words.';
    firstOvergrown.prepend(line);
  }
}

/* ============================================================
   VINE INTERACTION — brushing the growth aside, and a scroll sway
   that hints it's alive.

   CONTRACT: this section only ever touches #vinefield as a whole —
   it never reaches inside it. Whatever renderVines() (above) puts
   inside that div — placeholder leaf icons today, hand-drawn corner
   art later, something else entirely after that — gets brushed and
   swayed automatically, with zero changes needed here.
   ============================================================ */
(function initVineInteraction(){
  const BRUSH_R      = 92;     // how wide a clearing the cursor opens, in field px
  const GROW_RATE     = 0.22;  // per-frame ease when the hole is opening (snappy)
  const REGROW_RATE   = 0.018; // per-frame ease when it's closing (slow, "growing back")
  const REGROW_DELAY  = 1300;  // ms of stillness before it starts growing back
  const SWAY_MAX      = 13;    // px of lateral sway at the strongest scroll kick
  const SWAY_DECAY    = 0.90;  // per-frame damping of the sway spring
  const TOUCH_SWIPE_PX = 10;   // a touch has to actually move this far before it
                                // counts as a swipe — a plain tap should do nothing,
                                // and this is also what stops mobile's fingerdown at
                                // the very start of a page-scroll from reading as a brush

  let lastClientX = -9999, lastClientY = -9999;
  let holeX = -999, holeY = -999, holeR = 0, holeTargetR = 0;
  let regrowTimer = null;
  let swayX = 0, lastScrollY = window.scrollY;
  let touchStartX = null, touchStartY = null, touchIsSwiping = false;

  // returns whether the pointer is over the growth at all
  function updateHoleFromLast(){
    const field = document.getElementById('vinefield');
    if (!field) return false;
    const rect = field.getBoundingClientRect();
    if (lastClientY < rect.top || lastClientY > rect.bottom ||
        lastClientX < rect.left || lastClientX > rect.right){
      return false;                  // cursor isn't over the growth at all
    }
    holeX = lastClientX - rect.left;
    holeY = lastClientY - rect.top;
    return true;
  }

  // start growing back right away (no stillness delay)
  function regrowNow(){
    clearTimeout(regrowTimer);
    holeTargetR = 0;
  }

  function scheduleRegrow(){
    clearTimeout(regrowTimer);
    regrowTimer = setTimeout(() => { holeTargetR = 0; }, REGROW_DELAY);
  }

  function onPointerMove(e){
    // touch: require real movement before it counts as a swipe, so tapping a
    // message never clears growth — only a deliberate drag does, and it keeps
    // following the finger for as long as the swipe continues
    if (e.pointerType === 'touch'){
      if (touchStartX == null){ touchStartX = e.clientX; touchStartY = e.clientY; }
      if (!touchIsSwiping){
        const moved = Math.hypot(e.clientX - touchStartX, e.clientY - touchStartY);
        if (moved < TOUCH_SWIPE_PX) return;
        touchIsSwiping = true;
      }
    }
    if (breezeActive){
      if (Math.abs(e.clientX - lastClientX) < 3 && Math.abs(e.clientY - lastClientY) < 3) return;
      breezeActive = false;
    }
    lastClientX = e.clientX; lastClientY = e.clientY;
    // only keep a clearing open while the pointer is actually over the ivy.
    // (Before, moving anywhere — e.g. through the blue side margin on the way
    // out of the window — kept the last clearing frozen open at the column's edge.)
    if (!updateHoleFromLast()){ regrowNow(); return; }
    holeTargetR = BRUSH_R * uiScale();
    scheduleRegrow();
  }

  // belt-and-suspenders: whatever happens mid-touch (the OS deciding it's a
  // scroll and cancelling the pointer session, a stray missed event), lifting
  // the finger always guarantees the clearing starts fading back — it can
  // never get stuck open
  function onTouchEnd(e){
    if (e.pointerType !== 'touch') return;
    touchStartX = touchStartY = null;
    touchIsSwiping = false;
    if (!breezeActive) scheduleRegrow();   // don't cut a running breeze short
  }

  function onScroll(){
    const y = window.scrollY;
    const delta = y - lastScrollY;
    lastScrollY = y;
    swayX = Math.max(-SWAY_MAX, Math.min(SWAY_MAX, swayX + delta * 0.16));
    if (!breezeActive) updateHoleFromLast();   // content moved under a stationary cursor
    maybeBreeze();
  }

  /* ---- the breeze: teaching the gesture without instructions ----
     The first time a well-overgrown message (stage 2+, or any overgrown one
     if the wall is short) sits comfortably on screen, the ivy parts by itself
     — the same clearing a cursor or finger makes, sweeping once across the
     message through its ivy — then grows back as usual. Once per visit. Any
     real brush takes over immediately. Skipped with reduced motion on. */
  const BREEZE_MS = 1700;
  const REDUCE_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let breezeDone = REDUCE_MOTION, breezeActive = false, breezePending = false;
  function breezeTarget(){
    return document.querySelector('.note[data-overgrown="3"], .note[data-overgrown="2"]')
        || document.querySelector('.note[data-overgrown]');
  }
  function comfortablyOnScreen(note){
    const r = note.querySelector('.plate').getBoundingClientRect();
    return r.top > innerHeight*0.12 && r.bottom < innerHeight*0.82;
  }
  function maybeBreeze(){
    if (breezeDone || breezePending) return;
    const note = breezeTarget();
    if (!note || !comfortablyOnScreen(note)) return;
    // wait a beat so a fast fling past it doesn't trigger it mid-blur
    breezePending = true;
    setTimeout(() => {
      breezePending = false;
      if (!breezeDone && comfortablyOnScreen(note)) runBreeze(note);
    }, 450);
  }
  function runBreeze(note){
    const field = document.getElementById('vinefield');
    if (!field) return;
    breezeDone = true; breezeActive = true;
    const fr = field.getBoundingClientRect(), pr = note.querySelector('.plate').getBoundingClientRect();
    const y = +note.dataset.vineY || (pr.top - fr.top + pr.height/2);
    const x0 = pr.left - fr.left + pr.width*0.08, x1 = pr.left - fr.left + pr.width*0.92;
    const t0 = performance.now();
    holeX = x0; holeY = y; holeTargetR = BRUSH_R * uiScale();
    clearTimeout(regrowTimer);
    (function frame(now){
      if (!breezeActive) return;                 // a real brush took over
      const p = Math.min(1, (now - t0) / BREEZE_MS);
      const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
      holeX = x0 + (x1 - x0)*e;
      holeY = y - Math.sin(e*Math.PI) * 14 * uiScale();   // a slight arc, like wind
      if (p < 1) requestAnimationFrame(frame);
      else { breezeActive = false; regrowNow(); }       // then the ivy creeps back
    })(t0);
  }

  function tick(){
    const rate = holeTargetR > holeR ? GROW_RATE : REGROW_RATE;
    holeR += (holeTargetR - holeR) * rate;
    if (holeR < 0.4) holeR = 0;
    const field = document.getElementById('vinefield');
    if (field){
      field.style.setProperty('--mx', holeX.toFixed(1) + 'px');
      field.style.setProperty('--my', holeY.toFixed(1) + 'px');
      field.style.setProperty('--mr', holeR.toFixed(1) + 'px');

      swayX *= SWAY_DECAY;
      if (Math.abs(swayX) < 0.05) swayX = 0;
      field.style.transform = swayX ? `translateX(${swayX.toFixed(2)}px)` : '';
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('pointermove', onPointerMove, {passive:true});
  window.addEventListener('pointerup', onTouchEnd, {passive:true});
  window.addEventListener('pointercancel', onTouchEnd, {passive:true});
  window.addEventListener('scroll', onScroll, {passive:true});
  // pointer left the window, or the window/tab lost focus: grow back
  document.documentElement.addEventListener('mouseleave', regrowNow);
  window.addEventListener('blur', regrowNow);
  document.addEventListener('visibilitychange', () => { if (document.hidden) regrowNow(); });
  requestAnimationFrame(tick);
})();

/* ---- pocket: persists per device via localStorage, refills on a timer ----
   Every device starts with a fixed hand (2 leaf, 1 acorn, 1 wing) — no
   randomness on first contact. The refill clock does NOT start at first
   visit; it starts the moment the device spends its first item, then
   grants one item per day up to the cap. A full pocket WASTES a refill
   rather than banking it — every 24-hour period is consumed on schedule
   whether or not there was room, so sitting at the cap doesn't queue up
   freebies for later. */
const POCKET_KEY = 'lattice_pocket_v2';
const REFILL_MS = 24 * 60 * 60 * 1000;
const POCKET_CAP = 4;
const STARTING_ITEMS = ['leaf','leaf','acorn','wing'];

function randomItem(){
  const r = Math.random();
  if (r < 0.20) return 'wing';       // 20% wing
  return r < 0.60 ? 'leaf' : 'acorn'; // 40% leaf, 40% acorn
}
function loadPocketState(){
  try { const raw = localStorage.getItem(POCKET_KEY); if (raw) return JSON.parse(raw); }
  catch(e){}
  return null;
}
function savePocketState(state){
  try { localStorage.setItem(POCKET_KEY, JSON.stringify(state)); } catch(e){}
}
// each completed 24-hour period is consumed on schedule, whether or not
// there was room for it — a full pocket wastes the refill rather than
// banking it for later, so nothing is owed once a slot next opens up.
// If the clock hasn't started yet (device hasn't spent its first item),
// this is a no-op — nothing accrues before that moment.
function applyOwedRefills(state){
  if (state.lastRefill == null) return false;
  const now = Date.now();
  let changed = false;
  while ((now - state.lastRefill) >= REFILL_MS){
    if (state.items.length < POCKET_CAP){
      state.items.push(randomItem());
      changed = true;
    }
    state.lastRefill += REFILL_MS;   // period used up either way
  }
  return changed;
}

let isFirstVisit = false;
let pocketState = loadPocketState();
if (!pocketState){
  isFirstVisit = true;
  pocketState = { items: [...STARTING_ITEMS], lastRefill: null };
}
applyOwedRefills(pocketState);
savePocketState(pocketState);
let pocket = pocketState.items;

// in case a tab is left open across a 27-hour boundary, without needing a reload
setInterval(() => {
  if (applyOwedRefills(pocketState)){ savePocketState(pocketState); drawPocket(); }
}, 5*60*1000);

function render(){
  wrap.innerHTML=messages.map((m,i)=>{
    const shown=m.mine?'':m.left.map(k=>`<i>${ico(k)}</i>`).join('');
    const give=m.mine?'':`<div class="give"><span class="lab">leave&nbsp;one&nbsp;&rsaquo;</span>${pocket.map((k,j)=>
      `<button data-msg="${i}" data-slot="${j}" title="leave ${k}" aria-label="Leave ${k}">${ico(k)}<span>${k}</span></button>`).join('')}</div>`;
    return `<div class="note">
      <div class="frame">
        <div class="plate">${escapeHtml(m.t)}</div>
        <div class="rail"><div class="left">${shown}</div>${give}</div>
      </div></div>`;
  }).join('');
  drawPocket(); observe(); requestAnimationFrame(renderVines);
}

function drawPocket(){
  const el=document.getElementById('pocket');
  el.innerHTML=pocket.length?pocket.map(k=>`<i title="${k}">${ico(k)}</i>`).join('')
    :'<span class="none">Nothing left to give. Come back soon.</span>';
}

let io;
function observe(){
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting) setTimeout(()=>e.target.classList.add('awake'),700);
  }),{threshold:.45});
  document.querySelectorAll('.note').forEach(n=>io.observe(n));
}

wrap.addEventListener('click',e=>{
  const b=e.target.closest('button[data-slot]'); if(!b) return;
  const mi=+b.dataset.msg, slot=+b.dataset.slot, tok=pocket[slot]; if(!tok) return;
  const msg = messages[mi]; if(!msg) return;
  pocket.splice(slot,1); msg.left.push(tok);
  if (pocketState.lastRefill == null) pocketState.lastRefill = Date.now(); // refill clock starts on first spend
  applyOwedRefills(pocketState); savePocketState(pocketState);
  render();
  if (msg.id){
    LatticeDB.giveGift(msg.id, tok).catch(err => {
      console.warn('LATTICE: gift did not save to the wall (still shows locally this visit):', err);
    });
  }
});

/* ---- arrival: shows the pocket's current contents every visit — what's
   in it is useful information whether it's a first-time starting hand or
   a returning device's earned-up stash, so this always plays. ---- */
const hand=document.getElementById('hand'), arrive=document.getElementById('arrive');
const arrivalMs = pocket.length ? 350 + pocket.length*420 : 0;
if (pocket.length){
  hand.innerHTML=pocket.map(k=>`<i>${ico(k)}</i>`).join('');
  [...hand.children].forEach((el,i)=>setTimeout(()=>el.classList.add('in'), 350+i*420));
  setTimeout(()=>arrive.classList.add('gone'), arrivalMs+1500);
  setTimeout(()=>arrive.remove(), arrivalMs+2600);
} else {
  arrive.remove();   // nothing to show if the pocket is currently empty
}

/* ---- feather ----
   The write button (#quill) is available as soon as the pocket intro fades,
   with an empty slot where its feather icon goes. The feather is the
   eye-catcher, not a gate: once the visitor has read a couple of messages
   (or 3s after the intro), it drifts down at a real feather's pace, sways,
   and settles into the button's empty slot — the button gives a small
   "catch." Because nobody has to wait for it, it can take its time.
   Tapping the feather mid-fall opens the writer. Reduced motion: no fall,
   the icon is simply there. */
const cv=document.getElementById('plume'), ctx=cv.getContext('2d'), fEl=document.getElementById('feather');
const quillEl=document.getElementById('quill');
const FALL_SPEED = 85;          // px per second — ~10s down a phone screen, like the original drift
const TIMER_FALLBACK_MS = 3000; // after the pocket intro, if nobody's scrolled yet
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (matchMedia('(pointer: coarse)').matches){
  const s = quillEl.querySelector('span');
  if (s && s.firstChild) s.firstChild.nodeValue = 'Tap here to write';
}
if (!reduceMotion) quillEl.classList.add('awaiting');
let trail=[], fx=0, fy=-70, t0=0, drift=false, ph=rnd(0,6.28), raf=0;
let startX=0, targetX=0, targetY=0, fallMs=0, feathered=false, fHalf=32, swayScale=1;
const size=()=>{cv.width=innerWidth;cv.height=innerHeight}; size();

// the button itself: up as soon as the intro is out of the way
setTimeout(() => quillEl.classList.add('in'), arrivalMs + 1500);

function landFeather(){
  drift=false;
  fEl.classList.remove('live');
  const wasWaiting = quillEl.classList.contains('awaiting');
  quillEl.classList.remove('awaiting');
  quillEl.classList.add('in');
  if (wasWaiting){
    quillEl.classList.add('caught');
    setTimeout(() => quillEl.classList.remove('caught'), 700);
  }
}
function launch(){
  // aim for the centre of the button's (empty) icon slot at this screen size
  fEl.classList.add('live');
  fHalf = fEl.offsetWidth/2;                 // 32px, or 44.8 at desktop size
  swayScale = uiScale();
  const icon = quillEl.querySelector('svg').getBoundingClientRect();
  targetX = icon.left + icon.width/2 - fHalf;
  targetY = icon.top  + icon.height/2 - fHalf;
  startX = Math.max(16, Math.min(innerWidth-2*fHalf-24, innerWidth*0.45 + rnd(-60,60)*swayScale));
  fallMs = (targetY + 70*swayScale) / (FALL_SPEED*swayScale) * 1000;   // same ~10s at either size
  fy=-70*swayScale; ph=rnd(0,6.28); drift=true; trail=[];
  t0=performance.now();
  cancelAnimationFrame(raf); raf=requestAnimationFrame(step);
}
// vertical progress: steady fall, then a soft slow-down over the last 15%
// (the two pieces meet at the same speed, so there's no visible hitch)
const K = 1/(0.85 + 0.075);
const fallCurve = p => p < 0.85 ? K*p : K*0.85 + K*0.075*(2*((p-.85)/.15) - ((p-.85)/.15)**2);
function step(now){
  if(drift){
    const p = Math.min(1, (now-t0)/fallMs);
    const t = (now-t0)/1000;
    const ey = fallCurve(p);
    const settle = p < 0.7 ? 1 : 1 - ((p-0.7)/0.3)**2;     // sway narrows only near the end
    const sway = (Math.sin(t*1.02+ph)*72 + Math.sin(t*2.25+ph)*16) * swayScale;
    fx = startX + (targetX-startX)*ey + sway*settle;
    fy = -70*swayScale + (targetY+70*swayScale)*ey;
    const rot = Math.sin(t*1.02+ph)*27*settle;
    const sc = p < 0.9 ? 1 : 1 - (p-0.9)/0.1*0.53;          // shrinks down to icon size as it settles
    fEl.style.transform=`translate(${fx.toFixed(1)}px,${fy.toFixed(1)}px) rotate(${rot.toFixed(1)}deg) scale(${sc.toFixed(3)})`;
    if (p < 0.9) trail.push({x:fx+fHalf,y:fy+fHalf+2,a:1,s:rnd(2,4)*swayScale});
    if (p >= 1) landFeather();
  }
  trail.forEach(p=>{p.a-=.011;p.y+=.13});
  trail=trail.filter(p=>p.a>0);
  ctx.clearRect(0,0,cv.width,cv.height);
  trail.forEach(p=>{ // square, quantized — halftone-ish, not soft
    ctx.fillStyle=`rgba(255,255,255,${(Math.round(p.a*4)/4)*.55})`;
    const s=Math.round(p.s);
    ctx.fillRect(Math.round(p.x/2)*2,Math.round(p.y/2)*2,s,s);
  });
  raf=(drift||trail.length)?requestAnimationFrame(step):0;
}
function triggerFeather(){
  if (feathered) return;
  feathered = true;
  removeEventListener('scroll', onReadScroll);
  if (reduceMotion) landFeather(); else launch();
}
// "read a couple first": once the third message is well into view, the
// visitor has scrolled past two. Ignored while the pocket intro still covers the page.
function onReadScroll(){
  if (arrive.isConnected && !arrive.classList.contains('gone')) return;
  const notes = document.querySelectorAll('.note');
  const readTwo = notes.length >= 3
    ? notes[2].getBoundingClientRect().top < innerHeight*0.6
    : scrollY > 150;
  if (readTwo) triggerFeather();
}
addEventListener('scroll', onReadScroll, {passive:true});
setTimeout(triggerFeather, arrivalMs + 1500 + TIMER_FALLBACK_MS);
fEl.addEventListener('click', ()=>{ landFeather(); openWrite(); });
addEventListener('resize', ()=>{ size(); clearTimeout(window.__g); window.__g=setTimeout(renderVines,180); });

/* ---- compose ---- */
const veil=document.getElementById('veil'), text=document.getElementById('text'),
      count=document.getElementById('count'), leave=document.getElementById('leave');
const quill=document.getElementById('quill');
const openWrite=()=>{veil.classList.add('on');text.focus()};
quill.addEventListener('click',openWrite);
quill.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openWrite()}});
document.getElementById('away').onclick=()=>veil.classList.remove('on');
document.getElementById('x').onclick=()=>veil.classList.remove('on');
text.addEventListener('input',()=>{
  const r=LIMIT-text.value.length;
  count.textContent=r; count.className='rem'+(r<0?' over':'');
  leave.disabled=!text.value.trim()||r<0;
});
leave.onclick=async ()=>{
  const value = text.value.trim();
  if (!value) return;
  leave.disabled = true; leave.textContent = 'Sending…';
  let id;
  try {
    id = await LatticeDB.postMessage(value);
  } catch(err){
    console.warn('LATTICE: could not post message:', err);
    leave.textContent = 'Try again'; leave.disabled = false;
    return;
  }
  messages.unshift({ id, t: value, left: [], mine:true });
  text.value=''; count.textContent=LIMIT;
  leave.textContent='Leave it'; leave.disabled=true;
  veil.classList.remove('on'); feathered=true; drift=false; fEl.classList.remove('live'); quill.classList.remove('in'); quill.classList.add('done');
  render(); scrollTo({top:0,behavior:'smooth'});
};

window.lattice={open(){['teacup','pinwheel'].forEach(k=>{if(!pocket.includes(k))pocket.push(k)});savePocketState(pocketState);render();return'teacup and pinwheel are in your pocket.'}};

/* ---- boot: fetch the wall once, then do the first render.
   Reads the wall with ONE plain HTTPS request to Firestore's REST API instead
   of the Firebase library. Why: the library has to download first (a few
   hundred KB — slow on a phone) and then reads over a streaming connection
   that some phone networks and iOS Safari stall; the library waits ~10s
   before it gives up and falls back. A single request has neither problem,
   starts immediately, and returns identical data. (The Firebase library still
   handles posting and leaving items; it loads in the background.)
   The same security rules apply to this request as to the library. ---- */
const WALL_URL = "https://firestore.googleapis.com/v1/projects/lattice-731c2/databases/(default)/documents:runQuery?key=AIzaSyDl32I3wTqjdNKRloDCI4iqVAyDIrN80Hw";
const WALL_TIMEOUT_MS = 8000;   // a stuck request falls back to the seed messages instead of a blank wall
async function fetchWall(cap = 300){
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), WALL_TIMEOUT_MS);
  try {
    const r = await fetch(WALL_URL, {
      method: "POST", signal: ctl.signal,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ structuredQuery: {
        from: [{ collectionId: "messages" }],
        orderBy: [{ field: { fieldPath: "createdAt" }, direction: "DESCENDING" }],
        limit: cap
      }})
    });
    if (!r.ok) throw new Error("wall request failed: HTTP " + r.status);
    const rows = await r.json();
    return rows.filter(row => row.document).map(row => {
      const f = row.document.fields || {};
      return {
        id: row.document.name.split("/").pop(),
        t: (f.text && f.text.stringValue) || "",
        left: ((f.left && f.left.arrayValue && f.left.arrayValue.values) || []).map(v => v.stringValue)
      };
    });
  } finally { clearTimeout(timer); }
}
async function boot(){
  try {
    const fetched = await fetchWall();
    messages = fetched.length
      ? fetched.map(m => ({...m, mine:false}))
      : FALLBACK_SEED_MESSAGES.map(m => ({...m, id:null, mine:false}));
  } catch(err){
    console.warn('LATTICE: could not reach the wall, showing local messages instead:', err);
    messages = FALLBACK_SEED_MESSAGES.map(m => ({...m, id:null, mine:false}));
  }
  render();
}
boot();
</script>
